name: e2e-cache

# Manual check that a live firerunner tier's dependency cache saves and
# restores across runners: one job saves a random file under a key unique to
# the run, a second job on another runner restores it and compares its hash.
# A miss fails the run. Use it on a tier that sets ec2.cache (or a Firecracker
# tier with --cache-port), e.g. from scripts/e2e:
#   gh workflow run e2e-cache.yml -f runner=<tier name>
on:
  workflow_dispatch:
    inputs:
      runner:
        description: the runs-on label of the tier to test
        required: true

permissions:
  contents: read

jobs:
  save:
    runs-on: ${{ inputs.runner }}
    outputs:
      sha: ${{ steps.make.outputs.sha }}
    steps:
      - name: Make a random file
        id: make
        run: |
          mkdir -p probe
          head -c 1048576 /dev/urandom > probe/blob
          echo "sha=$(sha256sum probe/blob | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Save it to the cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: probe
          key: e2e-cache-${{ github.run_id }}-${{ github.run_attempt }}

  restore:
    needs: save
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Restore it from the cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: probe
          key: e2e-cache-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Compare its hash
        env:
          WANT: ${{ needs.save.outputs.sha }}
        run: |
          got="$(sha256sum probe/blob | cut -d' ' -f1)"
          echo "saved $WANT, restored $got"
          test "$got" = "$WANT"
