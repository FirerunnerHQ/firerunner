name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test with race detector and coverage gate
        run: make cover-check
      - name: Test golden docker shim
        run: images/test-docker-shim.sh

  # The egress firewall against the real kernel's nftables, in throwaway
  # network namespaces: what a guest can and cannot reach in each egress mode.
  netns:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Install nftables
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables
      - name: Egress firewall in network namespaces
        run: make netns-test

  # End-to-end boot of a real Firecracker microVM. Requires a KVM-capable
  # self-hosted runner; runs only when manually dispatched so it never blocks PRs.
  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, kvm]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: End-to-end tests
        run: make e2e
