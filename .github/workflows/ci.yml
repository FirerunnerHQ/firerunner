name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The race and coverage run is the critical path; build, vet and the shell
  # tests run beside it in their own jobs.
  #
  # The Go jobs keep their own build cache instead of setup-go's. setup-go keys
  # one cache on the Go version and go.sum for every job, so whichever job
  # finishes first saves it (netns, which builds two packages), and the race
  # build never finds its own output. These keys name the job, because a -race
  # -coverpkg build shares nothing with a plain one, and hash the sources, so a
  # change saves a fresh entry and the next run restores the nearest one.
  test:
    runs-on: ubuntu-latest
    env:
      # The restored cache also holds test results: run every test anyway.
      GOFLAGS: -count=1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - name: Restore race build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-race-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-race-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-race-${{ runner.os }}-${{ steps.go.outputs.go-version }}-
      - name: Test with race detector and coverage gate
        run: make cover-check

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-build-${{ runner.os }}-${{ steps.go.outputs.go-version }}-
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...

  # Shell tests for the image scripts: no Go needed. One step per script.
  shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test golden docker shim
        run: images/test-docker-shim.sh
      - name: Test EC2 runner boot script
        run: images/test-ec2-run.sh
      - name: Test EC2 AMI build script
        run: images/test-build-ec2-ami.sh
      - name: Test mutation script
        run: scripts/test-mutate.sh
      - name: Test stacked-PR merge script
        run: scripts/test-merge-stack.sh

  # The egress firewall against the real kernel's nftables, in throwaway
  # network namespaces: what a guest can and cannot reach in each egress mode.
  netns:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Install nftables
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables
      - name: Identity records readable but not writable by a separate UID
        run: |
          go test -c -o /tmp/fr-identity.test ./internal/jobidentity
          sudo /tmp/fr-identity.test -test.run '^TestReaderSeparateUID$' -test.v
      - name: Egress firewall in network namespaces
        run: FR_REQUIRE_NETNS=1 make netns-test

  cache-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Build cache server
        run: go build -o /tmp/firerunner-cache-test ./cmd/firerunner
      - name: Install pinned cache toolkit
        run: npm ci --prefix test/cache-protocol --ignore-scripts
      - name: Real toolkit archive save and restore across ref scopes
        env:
          FIRERUNNER_BINARY: /tmp/firerunner-cache-test
        run: npm test --prefix test/cache-protocol

  # End-to-end boot of a real Firecracker microVM. Requires a KVM-capable
  # self-hosted runner; runs only when manually dispatched so it never blocks PRs.
  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, kvm]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: End-to-end tests
        run: make e2e
