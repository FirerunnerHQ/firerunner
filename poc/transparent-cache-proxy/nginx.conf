worker_processes auto;
events {}

http {
    # Amazon's resolver, so upstream lookups skip the /etc/hosts override that
    # points this same name at the proxy.
    resolver 169.254.169.253 valid=30s ipv6=off;

    log_format route '$time_iso8601 $remote_addr "$request" $status $body_bytes_sent '
                     'rt=$request_time upstream=$upstream_addr';

    # The runner streams live step output over a WebSocket (/_ws/ingest.sock).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # guest-setup.sh fills this in: the local cache-server or a shared cache node.
    upstream cache_backend {
        server __CACHE_UPSTREAM__;
    }

    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;

    server {
        listen 443 ssl;
        # cache-server signs blob URLs with the scheme it sees, plain HTTP here.
        listen 80;
        server_name results-receiver.actions.githubusercontent.com;

        ssl_certificate     /etc/firerunner-poc/server.pem;
        ssl_certificate_key /etc/firerunner-poc/server.key;

        access_log /var/log/nginx/results-receiver.log route;
        error_log  /var/log/nginx/results-receiver.error.log info;

        location ~ ^/twirp/github\.actions\.results\.api\.v1\.CacheService/ {
            proxy_pass http://cache_backend;
            proxy_set_header Host $host;
        }
        location ~ ^/(upload|download)/ {
            proxy_pass http://cache_backend;
            proxy_set_header Host $host;
        }

        location / {
            set $upstream results-receiver.actions.githubusercontent.com;
            proxy_pass https://$upstream;
            proxy_set_header Host $upstream;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_ssl_server_name on;
            proxy_ssl_name $upstream;
            proxy_ssl_verify on;
            # The default depth of 1 cannot reach a root through GitHub's intermediate.
            proxy_ssl_verify_depth 3;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        }
    }
}
