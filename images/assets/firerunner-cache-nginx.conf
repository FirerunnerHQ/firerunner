# firerunner-cache-nginx.conf: the EC2 runner's cache proxy, rendered into
# /etc/nginx/nginx.conf by firerunner-cache-setup when the instance's tier
# caches (__UPSTREAM__ is cache-server's host:port). It answers as GitHub's
# results host, which /etc/hosts points here: actions/cache calls go to
# firerunner's cache-server, everything else (runner logs, the live-log
# WebSocket, artifacts) back to GitHub.
user www-data;
worker_processes auto;
pid /run/nginx.pid;
events {}

http {
    # Amazon's resolver, so the real results host is looked up past the
    # /etc/hosts entry that points it here.
    resolver 169.254.169.253 valid=30s ipv6=off;

    log_format route '$time_iso8601 $remote_addr "$request" $status $body_bytes_sent '
                     'rt=$request_time upstream=$upstream_addr';

    # The runner streams live step output over a WebSocket (/_ws/ingest.sock).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream cache_backend {
        server __UPSTREAM__;
    }

    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;

    server {
        # Loopback only: cache-server knows a job by this VM's address, so a
        # proxy others could reach would act for this VM's job.
        listen 127.0.0.1:443 ssl;
        # cache-server signs blob URLs with the scheme it is reached by:
        # plain HTTP, here.
        listen 127.0.0.1:80;
        server_name results-receiver.actions.githubusercontent.com;

        ssl_certificate     /etc/firerunner-cache/server.pem;
        ssl_certificate_key /etc/firerunner-cache/server.key;

        access_log /var/log/nginx/results-receiver.log route;
        error_log  /var/log/nginx/results-receiver.error.log warn;

        # A cache-server that is down must cost a job seconds, not minutes:
        # the toolkit retries a 5xx RPC for ~35 s per call, but takes ok:false
        # as a plain miss or a skipped save, and never retries a 507.
        location ~ ^/twirp/github\.actions\.results\.api\.v1\.CacheService/ {
            proxy_pass http://cache_backend;
            proxy_set_header Host $host;
            proxy_connect_timeout 1s;
            # Longer than cache-server's --identity-wait (60 s by default): a
            # job's first restore waits there for its identity, and a shorter
            # read timeout here would turn that wait into a miss.
            proxy_read_timeout 90s;
            error_page 502 504 = @cache_rpc_unavailable;
        }
        location ~ ^/(upload|download)/ {
            proxy_pass http://cache_backend;
            proxy_set_header Host $host;
            proxy_connect_timeout 1s;
            proxy_read_timeout 300s;
            error_page 502 504 = @cache_blob_unavailable;
        }
        location @cache_rpc_unavailable {
            default_type application/json;
            return 200 '{"ok":false,"message":"cache unavailable"}';
        }
        location @cache_blob_unavailable {
            return 507;
        }

        location / {
            set $upstream results-receiver.actions.githubusercontent.com;
            proxy_pass https://$upstream;
            proxy_set_header Host $upstream;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_ssl_server_name on;
            proxy_ssl_name $upstream;
            proxy_ssl_verify on;
            # The default depth of 1 cannot reach a root through GitHub's
            # intermediate: every call would fail, and a job lose its logs.
            proxy_ssl_verify_depth 3;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            # The live log may stay quiet through a long, silent step.
            proxy_read_timeout 1h;
        }
    }
}
