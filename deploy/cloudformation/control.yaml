AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  firerunner control plane: one control VM in an Auto Scaling group of one,
  replaced on failure, reachable by runners at a stable private DNS name.
  See deploy/cloudformation/README.md.

Parameters:
  Owner:
    Type: String
    AllowedPattern: "[A-Za-z0-9][A-Za-z0-9._-]{0,62}"
    Description: >-
      This install's firerunner:owner tag (FR_OWNER). Every replacement VM
      uses it, so it takes over its predecessor's pool and leftovers. Scopes
      the VM's terminate/start/modify permissions.
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Where the control VM may run. It needs egress to GitHub (a public subnet, or NAT).
  AssociatePublicIp:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Give the control VM a public IP for egress (inbound stays VPC-only either way).
  RunnerSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: The runners' security group; only it may reach the JIT port.
  InstanceType:
    Type: String
    Default: t4g.small
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: Amazon Linux 2023 (it ships the AWS CLI). Use the x86_64 parameter with an x86 instance type.
  ParameterPrefix:
    Type: String
    Default: /firerunner
    AllowedPattern: "/[A-Za-z0-9/_.-]*[A-Za-z0-9_.-]"
    Description: >-
      SSM path. The control VM reads <prefix>/control/{version,sha256sums,env,tiers,app-private-key|token}
      and any runner AMI parameter under <prefix>/ (only there: an ami naming
      /aws/service/... is not readable).
  ReleaseRepo:
    Type: String
    Default: FirerunnerHQ/firerunner
    Description: GitHub repository whose releases the control VM installs.
  ZoneName:
    Type: String
    Default: firerunner.internal
    Description: The private zone's name; with HostedZoneId, that zone's name.
  HostedZoneId:
    Type: String
    Default: ""
    Description: An existing private hosted zone associated with the VPC; empty creates one.
  JitName:
    Type: String
    Default: control
    Description: The JIT name is <JitName>.<zone>.
  JitPort:
    Type: Number
    Default: 8098
  Cache:
    Type: String
    AllowedValues: ["off", "disk", "s3"]
    Default: "off"
    Description: >-
      Run cache-server on the control VM for EC2 tiers that set ec2.cache:
      off; disk (blobs on the VM, lost with it); or s3 (blobs and the index
      in a bucket this stack makes, with copies on the VM). The bucket is
      kept when the stack is deleted; empty and delete it by hand.
  CachePort:
    Type: Number
    Default: 8099
  AppKMSKeyArn:
    Type: String
    Default: ""
    AllowedPattern: "(arn:[a-z-]+:kms:[a-z0-9-]+:[0-9]{12}:key/(mrk-)?[0-9a-f-]+)?"
    Description: >-
      An AWS KMS key holding the GitHub App's private key (see the README,
      "Keeping the App key in KMS"). Set, the VM signs with it and is given
      no key: <prefix>/control/app-private-key is not read.
  RootVolumeGiB:
    Type: Number
    Default: 30
    MinValue: 8
    Description: >-
      The control VM's root volume (gp3). With Cache on, cache-server's
      local blobs, copies and staged uploads are capped to a share of it.

Conditions:
  CreateZone: !Equals [!Ref HostedZoneId, ""]
  CacheOn: !Not [!Equals [!Ref Cache, "off"]]
  CacheS3: !Equals [!Ref Cache, "s3"]
  AppKeyInKMS: !Not [!Equals [!Ref AppKMSKeyArn, ""]]

Resources:
  Zone:
    Type: AWS::Route53::HostedZone
    Condition: CreateZone
    Properties:
      Name: !Ref ZoneName
      VPCs: [{ VPCId: !Ref VpcId, VPCRegion: !Ref AWS::Region }]
      HostedZoneConfig: { Comment: !Sub "firerunner control plane (${AWS::StackName})" }

  ControlSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: firerunner control VM; JIT port from the runners only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref JitPort
          ToPort: !Ref JitPort
          SourceSecurityGroupId: !Ref RunnerSecurityGroupId
          Description: runners fetch their JIT config
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 0.0.0.0/0, Description: GitHub and AWS APIs }

  CacheIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: CacheOn
    Properties:
      GroupId: !Ref ControlSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref CachePort
      ToPort: !Ref CachePort
      SourceSecurityGroupId: !Ref RunnerSecurityGroupId
      Description: runners reach cache-server

  # A cache, not a record: no versioning; keys stay under firerunner-cache/.
  CacheBucket:
    Type: AWS::S3::Bucket
    Condition: CacheS3
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      # Parts of an upload a crash or a replaced VM left behind.
      LifecycleConfiguration:
        Rules: [{ Id: abort-incomplete-uploads, Status: Enabled, AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 } }]
      Tags: [{ Key: firerunner:control, Value: !Ref AWS::StackName }]

  ControlRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: sts:AssumeRole }]
      # Session Manager: shell and remote commands without SSH or open ports.
      ManagedPolicyArns: [!Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"]
      Policies:
        - PolicyName: firerunner-control
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # runner-compute:begin (identical in byoc-role.yaml; test-policies.py checks)
              # Launches: the instance and its volumes must carry this owner's
              # tag, and the network it joins must be this VPC; images and
              # spot requests come with the launch.
              - Effect: Allow
                Action: ec2:RunInstances
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*"
                Condition: { StringLike: { "aws:RequestTag/firerunner:owner": [!Ref Owner, !Sub "${Owner}/*"] } }
              - Effect: Allow
                Action: ec2:RunInstances
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*"
                Condition:
                  ArnEquals: { ec2:Vpc: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/${VpcId}" }
              - Effect: Allow
                Action: ec2:RunInstances
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}::image/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:spot-instances-request/*"
              # Tags at launch must name this install as owner, and later tags
              # go only on its own instances and never change the owner: else
              # tagging would extend the owner-scoped grants below to anything.
              - Effect: Allow
                Action: ec2:CreateTags
                Resource: "*"
                Condition:
                  StringEquals: { ec2:CreateAction: RunInstances }
                  StringLike: { "aws:RequestTag/firerunner:owner": [!Ref Owner, !Sub "${Owner}/*"] }
              - Effect: Allow
                Action: ec2:CreateTags
                Resource: "*"
                Condition:
                  StringLike: { "aws:ResourceTag/firerunner:owner": [!Ref Owner, !Sub "${Owner}/*"] }
                  ForAllValues:StringNotEquals: { aws:TagKeys: [firerunner:owner] }
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeImages
                  - ec2:DescribeSpotInstanceRequests
                  # firerunner doctor: the tiers' subnets, routes, groups
                  # and instance types, and the vCPU quotas they use.
                  - ec2:DescribeSubnets
                  - ec2:DescribeRouteTables
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeInstanceTypes
                  - servicequotas:GetServiceQuota
                  - servicequotas:GetAWSDefaultServiceQuota
                Resource: "*"
              - Effect: Allow
                Action: [ec2:TerminateInstances, ec2:StartInstances, ec2:ModifyInstanceAttribute]
                Resource: "*"
                Condition: { StringLike: { "aws:ResourceTag/firerunner:owner": [!Ref Owner, !Sub "${Owner}/*"] } }
              - Effect: Allow
                Action: ec2:CancelSpotInstanceRequests
                Resource: "*"
                Condition: { StringLike: { "aws:ResourceTag/firerunner:owner": [!Ref Owner, !Sub "${Owner}/*"] } }
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPrefix}/*"
              # runner-compute:end
              - Effect: Allow
                Action: route53:ChangeResourceRecordSets
                Resource: !Sub
                  - "arn:${AWS::Partition}:route53:::hostedzone/${Z}"
                  - { Z: !If [CreateZone, !Ref Zone, !Ref HostedZoneId] }
              # No S3 here: the bucket is CacheRole's alone (CacheAssume).
              # Signing only: the key cannot be read, and only this key.
              - !If
                - AppKeyInKMS
                - Effect: Allow
                  Action: kms:Sign
                  Resource: !Ref AppKMSKeyArn
                  Condition: { StringEquals: { "kms:SigningAlgorithm": RSASSA_PKCS1_V1_5_SHA_256, "kms:MessageType": DIGEST } }
                - !Ref AWS::NoValue
              - Effect: Allow
                Action: autoscaling:SetInstanceHealth
                Resource: !Sub "arn:${AWS::Partition}:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${AWS::StackName}-control"

  ControlProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: { Roles: [!Ref ControlRole] }

  # cache-server parses requests from job code, so it never holds the control
  # role. The daemon assumes this role, which holds only cache-server's least
  # S3 policy (README, "Keeping the cache in S3"): objects under the prefix,
  # and ListBucket for it, so a missing index reads as 404. It hands the
  # session to cache-server in a file; cache-server cannot reach IMDS.
  CacheRole:
    Type: AWS::IAM::Role
    Condition: CacheS3
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { AWS: !GetAtt ControlRole.Arn }, Action: sts:AssumeRole }]
      MaxSessionDuration: 3600
      Policies:
        - PolicyName: firerunner-cache
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:AbortMultipartUpload]
                Resource: !Sub "${CacheBucket.Arn}/firerunner-cache/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt CacheBucket.Arn
                Condition: { StringLike: { "s3:prefix": ["firerunner-cache/*"] } }

  # The control role may assume CacheRole and no other. A policy of its own,
  # as CacheRole's trust names the control role: inline, the two would
  # depend on each other.
  CacheAssume:
    Type: AWS::IAM::RolePolicy
    Condition: CacheS3
    Properties:
      RoleName: !Ref ControlRole
      PolicyName: firerunner-cache-assume
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Resource: !GetAtt CacheRole.Arn

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref ImageId
        InstanceType: !Ref InstanceType
        IamInstanceProfile: { Arn: !GetAtt ControlProfile.Arn }
        # IMDS on IPv4 only; the cache unit denies both addresses all the same.
        MetadataOptions: { HttpTokens: required, HttpPutResponseHopLimit: 1, HttpEndpoint: enabled, HttpProtocolIpv6: disabled }
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: { VolumeSize: !Ref RootVolumeGiB, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: !Ref AssociatePublicIp
            Groups: [!Ref ControlSecurityGroup]
        TagSpecifications:
          - ResourceType: volume
            Tags: [{ Key: firerunner:control, Value: !Ref AWS::StackName }]
        # Download the release named by <prefix>/control/version, verify it
        # against <prefix>/control/sha256sums, and hand over to its bootstrap script. A
        # failure marks the instance unhealthy, so the group replaces it.
        UserData:
          Fn::Base64: !Sub
            - |
              #!/bin/bash
              set -euo pipefail
              export AWS_REGION=${AWS::Region}
              unhealthy() {
                t=$(curl -fsS -X PUT -H "X-aws-ec2-metadata-token-ttl-seconds: 60" http://169.254.169.254/latest/api/token)
                i=$(curl -fsS -H "X-aws-ec2-metadata-token: $t" http://169.254.169.254/latest/meta-data/instance-id)
                echo "firerunner user-data failed (line $1); marking $i unhealthy" >&2
                aws autoscaling set-instance-health --instance-id "$i" --health-status Unhealthy --no-should-respect-grace-period || true
              }
              trap 'unhealthy $LINENO' ERR
              install -d -m 0700 /etc/firerunner
              cat > /etc/firerunner/bootstrap.env <<'EOF'
              FR_PREFIX=${ParameterPrefix}
              FR_OWNER=${Owner}
              FR_ASG=${AWS::StackName}-control
              FR_ZONE_ID=${ZoneId}
              FR_JIT_HOST=${JitName}.${ZoneName}
              FR_JIT_PORT=${JitPort}
              AWS_REGION=${AWS::Region}
              FR_CACHE=${Cache}
              FR_CACHE_PORT=${CachePort}
              FR_CACHE_BUCKET=${CacheBucketName}
              FR_CACHE_ROLE_ARN=${CacheRoleArn}
              FR_ROOT_GIB=${RootVolumeGiB}
              FR_APP_KMS_KEY=${AppKMSKeyArn}
              EOF
              version=$(aws ssm get-parameter --name ${ParameterPrefix}/control/version --query Parameter.Value --output text)
              case "$(uname -m)" in x86_64) arch=amd64 ;; aarch64) arch=arm64 ;; *) false ;; esac
              d=$(mktemp -d) && cd "$d"
              # The checksums deploy-control.sh pinned when it deployed this
              # version, not the release's own: a replaced release asset fails.
              aws ssm get-parameter --name ${ParameterPrefix}/control/sha256sums --query Parameter.Value --output text > SHA256SUMS
              for f in firerunner_linux_$arch firerunner-control-bootstrap.sh; do
                curl -fsSL --retry 5 -o "$f" "https://github.com/${ReleaseRepo}/releases/download/$version/$f"
              done
              grep -E "  (firerunner_linux_$arch|firerunner-control-bootstrap\.sh)$" SHA256SUMS > want
              [ "$(wc -l < want)" -eq 2 ]
              sha256sum -c want
              mv "firerunner_linux_$arch" firerunner
              echo "firerunner user-data: installing $version" >&2
              bash firerunner-control-bootstrap.sh "$d"
            - ZoneId: !If [CreateZone, !Ref Zone, !Ref HostedZoneId]
              CacheBucketName: !If [CacheS3, !Ref CacheBucket, ""]
              # IAM may show CacheAssume a little after it exists; the daemon
              # retries until it may assume the role.
              CacheRoleArn: !If [CacheS3, !GetAtt CacheRole.Arn, ""]

  ControlGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    # After CacheAssume, so a new stack's first VM may assume the cache role
    # when it boots. DependsOn cannot name a resource that may not exist;
    # a reference in Metadata orders the two all the same.
    Metadata:
      CacheAssume: !If [CacheS3, !Ref CacheAssume, ""]
    Properties:
      AutoScalingGroupName: !Sub "${AWS::StackName}-control"
      MinSize: "1"
      MaxSize: "1"
      DesiredCapacity: "1"
      VPCZoneIdentifier: !Ref SubnetIds
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      HealthCheckType: EC2
      HealthCheckGracePeriod: 300
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-control", PropagateAtLaunch: true }
        # Never firerunner:owner: the reaper would take the control VM for
        # one of its own.
        - { Key: firerunner:control, Value: !Ref AWS::StackName, PropagateAtLaunch: true }

Outputs:
  AutoScalingGroup:
    Value: !Ref ControlGroup
  JitHost:
    Description: Resolves, inside the VPC, to the current control VM.
    Value: !Sub "${JitName}.${ZoneName}"
  HostedZoneId:
    Value: !If [CreateZone, !Ref Zone, !Ref HostedZoneId]
  ControlSecurityGroup:
    Value: !Ref ControlSecurityGroup
  ParameterPrefix:
    Value: !Ref ParameterPrefix
  CacheBucket:
    Condition: CacheS3
    Description: cache-server's bucket (prefix firerunner-cache/); kept when the stack is deleted.
    Value: !Ref CacheBucket
