AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  firerunner cross-account role for bring-your-own-cloud: lets a firerunner
  control plane in another AWS account (a hosted one) launch and end runner
  instances in this account, with exactly the compute permissions of
  control.yaml's role, scoped to one owner tag. Assuming it requires the
  external ID. See deploy/cloudformation/README.md.

Parameters:
  TrustedAccountId:
    Type: String
    AllowedPattern: "[0-9]{12}"
    Description: The AWS account the control plane runs in.
  TrustedRoleName:
    Type: String
    Default: ""
    AllowedPattern: "[A-Za-z0-9+=,.@_/-]*"
    Description: The role in that account allowed to assume this one; empty trusts any principal there that also has the external ID.
  ExternalId:
    Type: String
    NoEcho: true
    MinLength: 16
    MaxLength: 1224
    AllowedPattern: "[A-Za-z0-9_+=,.@:/-]+"
    Description: >-
      The identifier the control plane presents when it assumes this role, unique to
      your install (from your firerunner account page). It guards against the confused
      deputy; it is not a secret (the role's trust policy shows it).
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The runners' VPC; launches may use only its subnets and security groups.
  Owner:
    Type: String
    AllowedPattern: "[A-Za-z0-9][A-Za-z0-9._-]{0,62}"
    Description: The install's firerunner:owner tag; the role touches only instances carrying it.
  ParameterPrefix:
    Type: String
    Default: /firerunner
    AllowedPattern: "/[A-Za-z0-9/_.-]*[A-Za-z0-9_.-]"
    Description: SSM path the control plane may read runner AMI parameters under.

Conditions:
  OneRole: !Not [!Equals [!Ref TrustedRoleName, ""]]

Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub "firerunner control plane in ${TrustedAccountId}, owner ${Owner}"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { AWS: !Sub "arn:${AWS::Partition}:iam::${TrustedAccountId}:root" }
            Action: sts:AssumeRole
            Condition: !If
              - OneRole
              - StringEquals: { sts:ExternalId: !Ref ExternalId }
                ArnEquals: { aws:PrincipalArn: !Sub "arn:${AWS::Partition}:iam::${TrustedAccountId}:role/${TrustedRoleName}" }
              - StringEquals: { sts:ExternalId: !Ref ExternalId }
      Policies:
        - PolicyName: firerunner-runner-compute
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # runner-compute:begin (identical in control.yaml; test-policies.py checks)
              # Launches: the instance and its volumes must carry this owner's
              # tag, and the network it joins must be this VPC; images and
              # spot requests come with the launch.
              - Effect: Allow
                Action: ec2:RunInstances
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*"
                Condition: { StringEquals: { "aws:RequestTag/firerunner:owner": !Ref Owner } }
              - Effect: Allow
                Action: ec2:RunInstances
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*"
                Condition:
                  ArnEquals: { ec2:Vpc: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/${VpcId}" }
              - Effect: Allow
                Action: ec2:RunInstances
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}::image/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:spot-instances-request/*"
              # Tags at launch must name this install as owner, and later tags
              # go only on its own instances and never change the owner: else
              # tagging would extend the owner-scoped grants below to anything.
              - Effect: Allow
                Action: ec2:CreateTags
                Resource: "*"
                Condition:
                  StringEquals:
                    ec2:CreateAction: RunInstances
                    "aws:RequestTag/firerunner:owner": !Ref Owner
              - Effect: Allow
                Action: ec2:CreateTags
                Resource: "*"
                Condition:
                  StringEquals: { "aws:ResourceTag/firerunner:owner": !Ref Owner }
                  ForAllValues:StringNotEquals: { aws:TagKeys: [firerunner:owner] }
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeImages
                  - ec2:DescribeSpotInstanceRequests
                Resource: "*"
              - Effect: Allow
                Action: [ec2:TerminateInstances, ec2:StartInstances, ec2:ModifyInstanceAttribute]
                Resource: "*"
                Condition: { StringEquals: { "aws:ResourceTag/firerunner:owner": !Ref Owner } }
              - Effect: Allow
                Action: ec2:CancelSpotInstanceRequests
                Resource: "*"
                Condition: { StringEquals: { "aws:ResourceTag/firerunner:owner": !Ref Owner } }
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPrefix}/*"
              # runner-compute:end

Outputs:
  RoleArn:
    Description: Give this to the control plane, with the external ID.
    Value: !GetAtt Role.Arn
