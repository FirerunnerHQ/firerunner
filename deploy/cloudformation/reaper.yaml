AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  firerunner reaper safety net (optional): a scheduled Lambda that ends an
  install's instances older than a limit since their latest start (running,
  or used and left stopped), in case firerunner itself is not there to
  (control VM down, a bug). Stopped pool instances are kept. It knows
  nothing of GitHub, so it also ends a job that runs past the limit: set it
  above your longest job. Given the install's pool key, it ends only what a
  MAC under that key proves the install launched.
  See deploy/cloudformation/README.md.

Parameters:
  Owner:
    Type: String
    AllowedPattern: "[A-Za-z0-9][A-Za-z0-9._-]{0,62}"
    Description: The install's firerunner:owner tag (control.yaml's Owner), and its tenants' (Owner/id). Nothing else is touched.
  MaxAgeMinutes:
    Type: String
    AllowedPattern: "([3-9][0-9]|[1-9][0-9]{2,5})"
    Default: "720"
    Description: End an instance this many minutes (at least 30) after its latest start.
  EveryMinutes:
    Type: String
    AllowedPattern: "([5-9]|[1-9][0-9]{1,3})"
    Default: "15"
    Description: How often to sweep, in minutes (at least 5).
  DryRun:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: Only log what would be ended.
  PoolKeySecret:
    Type: String
    Default: ""
    AllowedPattern: "(arn:[a-z-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+)?"
    Description: >-
      The ARN of the install's pool key secret (control.yaml's PoolKeySecret
      output). Given it, an instance is ended only if a MAC under the key proves
      the install launched it; anyone who may tag an instance can write the
      owner tag. Empty trusts the owner tag.

Conditions:
  HasPoolKey: !Not [!Equals [!Ref PoolKeySecret, ""]]

Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: firerunner-reaper
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ec2:DescribeInstances, ec2:DescribeSpotInstanceRequests]
                Resource: "*"
              - Effect: Allow
                Action: [ec2:TerminateInstances, ec2:CancelSpotInstanceRequests]
                Resource: "*"
                Condition: { StringLike: { "aws:ResourceTag/firerunner:owner": [!Ref Owner, !Sub "${Owner}/*"] } }
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt LogGroup.Arn
              - !If
                - HasPoolKey
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref PoolKeySecret
                - !Ref AWS::NoValue

  # Created here, not by Lambda on first run, so deleting the stack deletes
  # the logs too.
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-reaper"
      RetentionInDays: 14

  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-reaper"
      Runtime: python3.13
      Handler: index.handler
      Timeout: 120
      Role: !GetAtt Role.Arn
      Environment:
        Variables: { OWNER: !Ref Owner, MAX_AGE_MINUTES: !Ref MaxAgeMinutes, DRY_RUN: !Ref DryRun, POOL_KEY_SECRET: !Ref PoolKeySecret }
      Code:
        ZipFile: |
          import datetime, hashlib, hmac, json, os, struct
          import boto3

          OWNER = os.environ["OWNER"]
          MAX_AGE = datetime.timedelta(minutes=int(os.environ["MAX_AGE_MINUTES"]))
          DRY_RUN = os.environ.get("DRY_RUN") == "true"
          POOL_KEY_SECRET = os.environ.get("POOL_KEY_SECRET", "")
          # A stopped pool instance in these states is firerunner's to keep.
          POOL_KEPT = ("ready", "warming")
          # As internal/ec2/poolmac.go signs them.
          POOL_MAC, RUNNER_MAC, REQUEST_MAC = "firerunner/ec2-pool-mac/v1", "firerunner/ec2-runner-mac/v1", "firerunner/ec2-request-mac/v1"


          def tag(i, key):
              return next((t["Value"] for t in i.get("Tags", []) if t["Key"] == key), "")


          def mac(key, domain, *fields):
              """The hex HMAC-SHA256 of the domain and the length-prefixed fields."""
              m = hmac.new(key, domain.encode(), hashlib.sha256)
              for f in fields:
                  b = f.encode()
                  m.update(struct.pack(">I", len(b)) + b)
              return m.hexdigest()


          def signed(got, want):
              return got != "" and hmac.compare_digest(got, want)


          def launched_here(ec2, key, i):
              """Whether a MAC under the pool key proves the install launched i:
              its pool MAC, its runner MAC, or its spot request's request MAC.
              The owner tag alone proves nothing: anyone who may tag can write it."""
              if key is None:
                  return True
              iid, owner, tier, runner = i["InstanceId"], tag(i, "firerunner:owner"), tag(i, "firerunner:tier"), tag(i, "firerunner:runner")
              if signed(tag(i, "firerunner:pool-mac"), mac(key, POOL_MAC, owner, tier, iid)):
                  return True
              if runner and signed(tag(i, "firerunner:runner-mac"), mac(key, RUNNER_MAC, owner, tier, runner, iid)):
                  return True
              req = i.get("SpotInstanceRequestId")
              if req:
                  r = ec2.describe_spot_instance_requests(SpotInstanceRequestIds=[req])["SpotInstanceRequests"]
                  if r and signed(tag(r[0], "firerunner:request-mac"), mac(key, REQUEST_MAC, owner, tag(r[0], "firerunner:tier"), req)):
                      return True
              return False


          def pool_key(sm):
              """The install's pool key, as firerunner reads it (surrounding space
              trimmed), or None when none is given. A key that cannot be read fails
              the run, so that nothing is ended unproven."""
              if not POOL_KEY_SECRET:
                  return None
              sm = sm or boto3.client("secretsmanager")
              return sm.get_secret_value(SecretId=POOL_KEY_SECRET)["SecretString"].strip().encode()


          def handler(event, context, ec2=None, now=None, sm=None):
              ec2 = ec2 or boto3.client("ec2")
              now = now or datetime.datetime.now(datetime.timezone.utc)
              key = pool_key(sm)
              out = {"ended": [], "would_end": [], "kept_open_request": [], "unproven": [], "failed": [], "dry_run": DRY_RUN}
              pages = ec2.get_paginator("describe_instances").paginate(Filters=[
                  {"Name": "tag:firerunner:owner", "Values": [OWNER, OWNER + "/*"]},
                  {"Name": "instance-state-name", "Values": ["pending", "running", "stopped"]},
              ])
              for page in pages:
                  for res in page["Reservations"]:
                      for i in res["Instances"]:
                          iid = i["InstanceId"]
                          if i["State"]["Name"] == "stopped" and tag(i, "firerunner:pool") in POOL_KEPT:
                              continue
                          # LaunchTime is the latest start: a used instance left
                          # stopped ages from the start of its job.
                          if now - i["LaunchTime"] < MAX_AGE:
                              continue
                          try:
                              proven = launched_here(ec2, key, i)
                          except Exception as e:
                              print(json.dumps({"instance": iid, "error": str(e)}))
                              out["failed"].append(iid)
                              continue
                          if not proven:
                              # Someone else's, retagged, or the install's own
                              # whose signing failed: firerunner doctor lists it.
                              out["unproven"].append(iid)
                              continue
                          if DRY_RUN:
                              out["would_end"].append(iid)
                              continue
                          try:
                              if not cancel_request(ec2, i.get("SpotInstanceRequestId")):
                                  out["kept_open_request"].append(iid)
                                  continue
                              ec2.terminate_instances(InstanceIds=[iid])
                              out["ended"].append(iid)
                          except Exception as e:
                              print(json.dumps({"instance": iid, "error": str(e)}))
                              out["failed"].append(iid)
              print(json.dumps(out))
              if out["failed"]:
                  raise RuntimeError("could not end %d instance(s): %s" % (len(out["failed"]), out["failed"]))
              return out


          def cancel_request(ec2, req):
              """Cancel a persistent spot request before its instance is ended, or AWS
              launches an untracked replacement. A one-time request needs nothing.
              Returns False when it must stay open."""
              if not req:
                  return True
              try:
                  r = ec2.describe_spot_instance_requests(SpotInstanceRequestIds=[req])["SpotInstanceRequests"]
                  if r and r[0].get("Type") == "one-time":
                      return True
                  ec2.cancel_spot_instance_requests(SpotInstanceRequestIds=[req])
                  return True
              except Exception as e:
                  print(json.dumps({"request": req, "cancel_error": str(e)}))
                  return False

  Schedule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: !Sub "rate(${EveryMinutes} minutes)"
      Targets: [{ Id: reaper, Arn: !GetAtt Function.Arn }]
  SchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt Schedule.Arn

Outputs:
  FunctionName:
    Value: !Ref Function
